schema_version: ui-registry/v1
project_id: agent_ecology3
ui_status: active
surfaces:
  - id: agent-ecology3-dashboard
    lifecycle: candidate
    source_path: src/agent_ecology3/dashboard
    purpose: FastAPI dashboard app (single app.get("/") HTML entry point); its matched-pair review covers prescribed/minimal and Plan 24 trading/solo (tasks passed, scrip minted, calls, and whether each solved task was bought; task count no longer fixed at 8); an Interactions tab draws the live agent/task trade graph with Cytoscape; a Living view link opens the run in World Substrate's living view via its pinned renderer, including royalty events and task ids read from statement metadata; agents are listed in number order (Agent 2 before Agent 10) with benches named after their owners. For resident-agent runs the activity feed lists every kernel action in plain words (purchases, writes with the read price the agent set, submissions with checker results and royalties, refusals, end-of-turn notes), newest first, with blue/orange outcome colours. The Interactions tab shows a 16×16 agent matrix (rows used the work of columns: code reads, code bought at a posted price, helper reuse, messages, and scrip paid by transfer as "paid N") from /agent-graph, with styled hover tooltips; agent-to-agent messages (send_message) appear in the feed as "messaged X: …" (joined to their action by the kernel's per-call action_id), in the matrix as "msg N", and in the Living view as public messages from sender to recipient; transfers appear in the feed as "paid X N scrip"; live and review views all read the same 100,000-event window; the older /interaction-graph endpoint remains for the task-level projection. A Bounties tab (Plan 27) lists the open gaps of an AES-governed pilot project as bounties (criterion, test module, standing, why it is open) from /pilot-bounties, which runs `aes reconcile --json` on the sandbox named by --pilot or AE3_PILOT_PATH and counts each gap once, as AES does; blue for INSUFFICIENT, dashed orange for REFUTED, styled tooltips on every control; `python -m agent_ecology3.dashboard --pilot PATH` serves the board on its own. Shared-project runs (Plan 27 M2, `run_resident_ecology.py --aes-pilot`) add feed rows for propose_change (submitted, integrated with commit and files, or rejected with the reason), AES judgements by "AES" ("SC-X: insufficient → supported"), bounty shares and function royalties (kernel rows, not counted as the payee's actions); the matrix adds "builds on N" (integrated code calls N functions the column agent wrote) and "co-built N" (both paid for N criteria) cells with styled tooltips and a shared-project summary line; the Living view adds a Project station where agents integrate, AES's criteria-met count, and bounty payments as messages from the Project; the Bounties tab reads the run's own copy of the pilot.
