simulation:
  default_duration_seconds: 120
  max_runtime_seconds: 3600
  summary_interval_seconds: 15
  loop:
    min_delay_seconds: 0.2
    max_delay_seconds: 8.0
    max_consecutive_errors: 5
    resource_check_interval_seconds: 1.0

principals:
  count: 3
  id_prefix: alpha_
  starting_scrip: 100
  starting_llm_budget: 0.5
  starting_disk_quota_bytes: 250000

resources:
  rate_window_seconds: 60.0
  rate_limits:
    llm_calls_per_window: 60
    llm_tokens_per_window: 100000
    cpu_seconds_per_window: 8.0
  stock:
    total_llm_budget: 3.0
    total_disk_bytes: 1000000

llm:
  default_model: minimax/minimax-m3
  timeout_seconds: 60
  num_retries: 2
  max_output_tokens: null
  provider_max_budget_usd: 0.0
  provider_budget_reservation_usd: 0.0
  allowed_models:
    - minimax/minimax-m3
    - openrouter/deepseek/deepseek-chat
    - deepseek/deepseek-chat
    - claude-code/opus
    - claude-code/sonnet
    - claude-code
    - gemini/gemini-2.5-flash
    - openai/gpt-4o-mini
    - anthropic/claude-3-5-sonnet-20241022
  model_override_acceptance:
    allowed_models:
      accepted_by: brian
      reason: "Agent ecology experiments keep explicit model-pool entries for agent SDK and provider-path comparisons; MiniMax-M3 remains the default model."
  estimate_tokens_per_call: 900
  # Agent SDK passthrough (forwarded to llm_client.call_llm for claude-code/codex).
  agent_cwd: .
  agent_max_turns: 6
  agent_permission_mode: acceptEdits
  enable_bootstrap_loop_llm: false
  loop_llm_cooldown_seconds: 0.0
  loop_cognition_mode: prescribed
  loop_prompt_feedback_enabled: true
  loop_action_gate_enabled: true

contracts:
  default_when_missing: kernel_contract_freeware
  default_for_new_artifact: kernel_contract_freeware

mint:
  enabled: true
  minimum_bid: 1
  first_auction_delay_seconds: 20.0
  bidding_window_seconds: 30.0
  period_seconds: 60.0
  mint_ratio: 10
  scoring_max_budget: 0.25

dashboard:
  enabled: true
  host: 0.0.0.0
  port: 9000
  jsonl_file: logs/latest/events.jsonl
  poll_interval_seconds: 1.0

logging:
  logs_dir: logs
  event_file_name: events.jsonl
  summary_file_name: summary.jsonl
  recent_event_limit: 500
