simulation:
  default_duration_seconds: 120
  max_runtime_seconds: 3600
  summary_interval_seconds: 15
  loop:
    min_delay_seconds: 0.2
    max_delay_seconds: 8.0
    max_consecutive_errors: 5
    resource_check_interval_seconds: 1.0

principals:
  count: 3
  id_prefix: alpha_
  starting_scrip: 100
  starting_llm_budget: 2.0
  starting_disk_quota_bytes: 250000

resources:
  rate_window_seconds: 60.0
  rate_limits:
    llm_calls_per_window: 120
    llm_tokens_per_window: 200000
    cpu_seconds_per_window: 12.0
  stock:
    total_llm_budget: 12.0
    total_disk_bytes: 1000000

llm:
  default_model: codex/gpt-5.6-luna
  model_justification: "Plan 10 qualifies one bounded AE3 action through the exact Luna subscription route."
  timeout_seconds: 90
  num_retries: 0
  max_output_tokens: null
  provider_max_budget_usd: 0.0
  provider_budget_reservation_usd: 0.0
  allowed_models:
    - codex/gpt-5.6-luna
  model_override_acceptance: {}
  estimate_tokens_per_call: 900
  agent_cwd: null
  agent_max_turns: 1
  agent_permission_mode: null
  enable_bootstrap_loop_llm: false
  loop_llm_cooldown_seconds: 0.0
  loop_forced_explore_mode: "off"
  loop_policy_seed: 0
  loop_cognition_mode: prescribed
  loop_prompt_template_path: null
  loop_prompt_feedback_enabled: true
  loop_action_gate_enabled: true
  subscription_budget_charge_mode: estimated
  subscription_estimated_cost_multiplier: 1.0
  decision_output_mode: luna_structured_v1
  reasoning_effort: medium
  codex_transport: cli
  codex_sandbox_mode: read-only
  codex_approval_policy: never
  codex_isolate_home: true
  structured_response_model: LunaLoopDecisionV1
  expected_billing_mode: subscription_included

contracts:
  default_when_missing: kernel_contract_freeware
  default_for_new_artifact: kernel_contract_freeware

mint:
  enabled: true
  minimum_bid: 1
  first_auction_delay_seconds: 20
  bidding_window_seconds: 30
  period_seconds: 60
  mint_ratio: 10
  scoring_max_budget: 0.25

dashboard:
  enabled: false
  host: 0.0.0.0
  port: 9000
  jsonl_file: logs/latest/events.jsonl
  poll_interval_seconds: 1.0

logging:
  logs_dir: logs
  event_file_name: events.jsonl
  summary_file_name: summary.jsonl
  recent_event_limit: 500
