# Machine-readable model of agent_ecology3 (AE3): the single declaration that
# the dashboard views are meant to be projections of. Prose: docs/model/ODD.md.
# View check: docs/model/VIEW_COVERAGE.md.
#
# Enforced by tests/test_model_declaration.py (no model calls):
#   - every event type passed to `logger.log("<type>", ...)` under src/ is
#     declared here, and every declared event is emitted in code;
#   - each declared emitter (file + function) really emits that event, and no
#     emitter is left undeclared;
#   - declared fields equal the literal payload keys at each emitter;
#   - every kernel action type (ActionType plus send_message) has a process;
#   - process.emits and event.emitted_by agree.
# Line numbers are as of commit 3a34a78 (2026-10-06); the test enforces file and
# function, not line, so a drifted line is a documentation fix, not a failure.

schema: ae3-model/v1
model: agent_ecology3 resident ecology
as_of_commit: 3a34a78

# scope values:
#   resident: reachable in a resident run (scripts/run_resident_ecology.py),
#             the model under study since Plan 25.
#   resident_unreachable: kernel path exists, but the agents' only tool
#             (mcp/loop_action_server.py ae3_action) cannot supply the
#             required fields, so resident agents cannot trigger it.
#   legacy: belongs to the older autonomous-loop / auction runs
#             (simulation/runner.py, mint auction mode, LLM syscalls); never
#             emitted in a resident run.
scopes: [resident, resident_unreachable, legacy]

entities:
  - name: Agent
    what: A long-lived Codex session acting as one principal (alpha_1 ... alpha_N).
    source: src/agent_ecology3/simulation/resident.py:128
    state:
      - {name: principal_id, type: str, meaning: "alpha_<n>; from config principals.id_prefix", source: src/agent_ecology3/world/world.py:345}
      - {name: token, type: str, meaning: "secret bearer token; the MCP server sends it, so an agent can act only as itself", source: src/agent_ecology3/simulation/resident.py:162}
      - {name: session_id, type: "str|null", meaning: "Codex session resumed every turn (memory between turns)", source: src/agent_ecology3/simulation/resident.py:132}
      - {name: actions_this_turn, type: int, meaning: "kernel actions used this turn; reset to 0 at turn start", source: src/agent_ecology3/simulation/resident.py:480}
      - {name: inbox, type: "list[(turn, sender, text)]", meaning: "messages received since the agent's last turn; shown once, then cleared", source: src/agent_ecology3/simulation/resident.py:138}
      - {name: workdir, type: path, meaning: "private scratch folder with a shell (agents/<id>/work; in a shared-project run, the agent's git worktree); running code there costs no actions", source: src/agent_ecology3/simulation/resident.py:321}
      - {name: scrip, type: int, meaning: "balance held in the Ledger (starts at 100)", source: config/config.yaml:14}
  - name: Artifact
    what: A named piece of text owned by one principal; everything agents read, write and submit.
    source: src/agent_ecology3/world/artifacts.py
    state:
      - {name: id, type: str, meaning: "agents are told to prefix ids with their own principal id", source: src/agent_ecology3/simulation/resident.py:346}
      - {name: type, type: str, meaning: "task_statement, solution:<task id>, or bootstrap types (agent_profile, strategy, state, notebook, agent_loop, kernel_service)"}
      - {name: owner, type: str, meaning: "principal paid when another principal reads it"}
      - {name: content, type: str}
      - {name: read_price, type: int, meaning: "scrip a non-owner pays to read; 2 for task statements; set by the writer with write_artifact read_price (default 0 for a new artifact; a rewrite without read_price keeps the price)", source: src/agent_ecology3/world/actions.py:635}
      - {name: access_contract_id, type: str, meaning: "freeware (anyone reads, only the writer writes) unless bootstrap-private", source: src/agent_ecology3/world/contracts.py:93}
      - {name: metadata.bounty_claimed_by, type: "str|null", meaning: "set on a task statement when its bounty is paid", source: src/agent_ecology3/world/mint.py:339}
      - {name: deleted, type: bool}
  - name: TaskStatement
    what: An Artifact of type task_statement, one per Task, written by the fixture before turn 1 and owned by the Task's owner.
    source: scripts/run_recoverable_evaluation.py:605
    state:
      - {name: id, type: str, meaning: "<owner>_task_<slug>"}
      - {name: read_price, type: int, meaning: "2 scrip", source: scripts/run_recoverable_evaluation.py:646}
      - {name: metadata.plan24_task_id, type: str}
  - name: Solution
    what: An Artifact whose type is solution:<task id>; plain Python defining the task's function.
    source: src/agent_ecology3/world/mint.py:107
    state:
      - {name: type, type: str, meaning: "solution:<task id>; names the task the checker runs"}
      - {name: content, type: str, meaning: "Python; a ``` fence is stripped before checking", source: src/agent_ecology3/world/mint.py:108}
  - name: Task
    what: One CodeFlowBench helper function with hidden literal tests and declared dependencies, loaded from the local bank.
    source: src/agent_ecology3/world/mint.py:126
    state:
      - {name: task_id, type: str, meaning: "CF/<problem>/<helper>"}
      - {name: owner, type: str, meaning: "round-robin over agents at bank build time", source: scripts/build_codeflow_bank.py:115}
      - {name: entry_point, type: str}
      - {name: prompt, type: str, meaning: "statement plus one worked example (that example is also one of the hidden cases)", source: scripts/build_codeflow_bank.py:55}
      - {name: test, type: str, meaning: "hidden check(candidate) over >=2 literal cases; never shown to agents", source: scripts/build_codeflow_bank.py:70}
      - {name: requires, type: "list[task_id]", meaning: "helpers of the same problem this task calls", source: scripts/build_codeflow_bank.py:111}
      - {name: claimed_by, type: "str|null", meaning: "first principal whose solution passed", source: src/agent_ecology3/world/mint.py:334}
      - {name: claimed_artifact, type: "str|null", meaning: "the passing solution later solutions are linked against", source: src/agent_ecology3/world/mint.py:340}
  - name: Ledger
    what: Scrip balances per principal; all money moves here.
    source: src/agent_ecology3/world/ledger.py
    state:
      - {name: scrip, type: "dict[principal, int]", meaning: "transfer_scrip refuses if the payer cannot afford it", source: src/agent_ecology3/world/ledger.py:61}
      - {name: resources.llm_budget, type: float, meaning: "set to 1.0 per agent in resident runs and never spent (Codex runs on the subscription)", source: scripts/run_resident_ecology.py:43}
  - name: Checker
    what: The mint in task_bounty mode plus the hidden-test scorer; scores each submission at once and pays the first pass.
    source: src/agent_ecology3/world/mint.py:304
    state:
      - {name: mint_ratio, type: int, meaning: "payment = score // mint_ratio = 100 // 10 = 10 scrip", source: config/config.yaml:84}
      - {name: royalty_scrip, type: int, meaning: "3 scrip per reused helper", source: src/agent_ecology3/config.py:162}
      - {name: minimum_bid, type: int, meaning: "1; checked and refunded, never kept", source: config/config.yaml:80}
      - {name: checker_timeout_seconds, type: float, meaning: "10 s per submission", source: src/agent_ecology3/config.py:159}
  - name: Message
    what: A free text note from one agent to another, delivered at the start of the recipient's next turn.
    source: src/agent_ecology3/simulation/resident.py:217
    state:
      - {name: sender, type: str}
      - {name: recipient, type: str}
      - {name: text, type: str, meaning: "1 to 1000 characters", source: src/agent_ecology3/simulation/resident.py:141}
      - {name: turn, type: int, meaning: "turn in which it was sent"}
  - name: Kernel
    what: The world clock and action endpoint shared by all agents.
    source: src/agent_ecology3/simulation/resident.py:145
    state:
      - {name: turn, type: int, meaning: "1..turns; every agent takes one turn per turn number", source: scripts/run_resident_ecology.py:103}
      - {name: actions_per_turn, type: int, meaning: "4 by default", source: scripts/run_resident_ecology.py:133}
      - {name: event_number, type: int, meaning: "advances once per parsed kernel action; send_message, parse failures and turn-limit refusals do not advance it", source: src/agent_ecology3/world/world.py:1951}
      - {name: action_count, type: int, meaning: "one id per /agent-act call (action_id), logged on resident_action and agent_message so views can join them; event_number cannot (send_message does not advance it)", source: src/agent_ecology3/simulation/resident.py:155}
      - {name: lock, type: asyncio.Lock, meaning: "actions from concurrent agents run one at a time, in arrival order", source: src/agent_ecology3/simulation/resident.py:179}

  # --- Plan 27 shared project (runs started with --aes-pilot) ------------
  - name: SharedProject
    what: The run's own git copy of an AES-governed pilot (stubbed tinydb; M1), cloned from the pilot sandbox so the sandbox is never changed. main is the integrated project; each agent has a worktree on branch agent/<id>.
    source: src/agent_ecology3/simulation/pilot.py:137
    state:
      - {name: root, type: path, meaning: "<run data dir>/pilot_project", source: scripts/run_resident_ecology.py:112}
      - {name: manifest, type: dict, meaning: "pilot.json: governed roots and each verification subject's criterion, test module and command", source: src/agent_ecology3/simulation/pilot.py:176}
      - {name: library_roots, type: "list[str]", meaning: "governed roots except tests/; the only files agents may change (existing files only)", source: src/agent_ecology3/simulation/pilot.py:196}
      - {name: last_reconcile, type: dict, meaning: "the latest aes reconcile --json; its criteria standings are the bounty board", source: src/agent_ecology3/simulation/pilot.py:203}
      - {name: held, type: "set[criterion id]", meaning: "criteria paid and SUPPORTED ever since; a criterion leaves when it is not SUPPORTED", source: src/agent_ecology3/simulation/pilot.py:383}
      - {name: bounty_scrip, type: int, meaning: "30 by default (--bounty-scrip), split among contributors", source: scripts/run_resident_ecology.py:175}
      - {name: test_timeout_seconds, type: int, meaning: "120; a hanging test run is killed and recorded as a failure", source: src/agent_ecology3/simulation/pilot.py:147}
  - name: AgentBranch
    what: An agent's git worktree of the SharedProject on branch agent/<id>; it is the agent's writable Codex folder (agents/<id>/work), a sibling of its Codex home.
    source: src/agent_ecology3/simulation/pilot.py:129
    state:
      - {name: path, type: path, meaning: "agents/<id>/work, with .venv linked to the pilot's test environment"}
      - {name: last_rejection, type: "str|null", meaning: "reason of the last rejected proposal, shown in the next observation"}
  - name: SuccessCriterion
    what: One AES success criterion SC-<M> per test module tests/test_<m>.py of the pilot; its standing comes only from aes reconcile --json.
    source: scripts/build_aes_pilot.py:120
    state:
      - {name: criterion_id, type: str}
      - {name: standing, type: str, meaning: "INSUFFICIENT (no current evidence, including evidence gone STALE), SUPPORTED or REFUTED"}
  - name: Observation
    what: An AES observation written by aes evidence record for one verification subject at one commit.
    source: src/agent_ecology3/simulation/pilot.py:344
    state:
      - {name: observation_id, type: str, meaning: "OBS-<M>-<commit[:8]>"}
      - {name: dependency_paths, type: "list[path]", meaning: "the test module, tests/conftest.py and the library files the test imports (AES discovers them); contributors are counted in these files"}
      - {name: freshness, type: str, meaning: "CURRENT or STALE (a dependency changed since the recorded commit)"}
  - name: Bounty
    what: The scrip a criterion pays when it becomes SUPPORTED and is not held; one per open criterion on the board.
    source: src/agent_ecology3/simulation/pilot.py:95
    state:
      - {name: amount, type: int, meaning: "bounty_scrip"}
  - name: Contribution
    what: An agent's surviving lines (git blame at the judged commit; author email <id>@agents.agent-ecology3.invalid) in a criterion's observation dependency files under the library roots.
    source: src/agent_ecology3/simulation/pilot.py:375
    state:
      - {name: agent, type: str}
      - {name: commit, type: str}
      - {name: files, type: "list[path]"}

processes:
  # --- scheduling and sensing -------------------------------------------
  - name: initialize_world
    actor: Kernel
    scope: resident
    inputs: [config, task bank path]
    rule: Create N principals with 100 scrip each, bootstrap per-agent artifacts and the checker, then log world_initialized.
    changes: [Ledger.scrip, Artifact (bootstrap)]
    emits: [world_initialized]
    source: src/agent_ecology3/world/world.py:326
  - name: seed_task_bank
    actor: Kernel
    scope: resident
    inputs: [task bank]
    rule: Write one task_statement artifact per Task, owned by the Task's owner, read price 2. Written straight into the store, so no event is logged.
    changes: [Artifact (TaskStatement)]
    emits: []
    source: scripts/run_recoverable_evaluation.py:605
  - name: run_turn
    actor: Kernel
    scope: resident
    inputs: [turn number]
    rule: For turn = 1..T, start every agent's turn at once (asyncio.gather); wait for all to finish before the next turn.
    changes: [Kernel.turn]
    emits: []
    source: scripts/run_resident_ecology.py:102
  - name: observe
    actor: Agent
    scope: resident
    inputs: [Kernel, Ledger, Artifact store, Agent.inbox]
    rule: Build the turn prompt - turn number, own scrip, all balances, every unclaimed task statement id grouped by read price (with claimed and total counts), the newest 60 other readable artifacts minus bootstrap ones (with a query_kernel paging hint for the rest), solved helpers the checker links, and the inbox (then clear it). In a shared-project run the task and artifact lists are replaced by the project section - open criteria with test module and standing, criteria met, the agent's branch state (unproposed files, ahead/behind main, merge in progress, last rejection) and integrations by others since its last turn. Rules (RESIDENT_RULES, or PILOT_RULES in a shared-project run) are prepended on turn 1 only.
    changes: [Agent.inbox (cleared), Agent.actions_this_turn (reset)]
    emits: []
    source: src/agent_ecology3/simulation/resident.py:238
  - name: end_turn
    actor: Agent
    scope: resident
    inputs: [Codex result]
    rule: Record the turn - action count, shell commands, note (first 2000 chars), cost. A non-ae3 built-in tool or an error finish stops the run as invalid.
    changes: [Agent.session_id, Agent.turns_taken]
    emits: [resident_turn, resident_session_changed]
    source: src/agent_ecology3/simulation/resident.py:531
  - name: act
    actor: Agent
    scope: resident
    inputs: [action payload via ae3_action]
    rule: Refuse with turn_action_limit once actions_this_turn reaches actions_per_turn; otherwise count the action, run send_message, propose_change (shared-project runs) or the kernel action, and log the outcome.
    changes: [Agent.actions_this_turn]
    emits: [resident_action]
    source: src/agent_ecology3/simulation/resident.py:178
  # --- resident actions -------------------------------------------------
  - name: read_artifact
    action_type: read_artifact
    actor: Agent
    scope: resident
    inputs: [artifact_id]
    rule: If the artifact exists and the contract allows reading, the reader pays its read_price to the owner (nothing moves when reading one's own) and gets the content.
    changes: [Ledger.scrip]
    emits: [artifact_read, action]
    source: src/agent_ecology3/world/action_executor.py:145
  - name: write_artifact
    action_type: write_artifact
    actor: Agent
    scope: resident
    inputs: [artifact_id, artifact_type, content, read_price]
    rule: Create or overwrite an artifact the agent may write (freeware - only its writer), within the 250000-byte disk quota. read_price (whole scrip, 0 or more) sets what other agents pay to read it; omitted, a new artifact is free and a rewrite keeps its price.
    changes: [Artifact]
    emits: [artifact_written, principal_created, action]
    source: src/agent_ecology3/world/action_executor.py:199
  - name: submit_to_mint
    action_type: submit_to_mint
    actor: Agent
    scope: resident
    inputs: [artifact_id, bid]
    rule: The checker links passing code of solved helpers the task requires or calls, runs the hidden tests in a fresh Python, and pays 10 scrip only to the first passing solution per task. The bid is checked but never taken.
    changes: [Ledger.scrip, Task.claimed_by, TaskStatement.metadata.bounty_claimed_by]
    emits: [task_bounty_scored, action]
    source: src/agent_ecology3/world/mint.py:304
  - name: pay_royalty
    actor: Checker
    scope: resident
    inputs: [passing first-claim solution, linked helpers]
    rule: For each linked helper the passing solution calls and does not redefine, credit its author 3 new scrip (minted, not paid by the solver); never to oneself.
    changes: [Ledger.scrip]
    emits: [royalty_paid]
    source: src/agent_ecology3/world/mint.py:387
  - name: transfer
    action_type: transfer
    actor: Agent
    scope: resident
    inputs: [recipient_id, amount]
    rule: Move a positive whole amount of scrip to another principal if affordable and cross-principal trading is on.
    changes: [Ledger.scrip]
    emits: [transfer, action]
    source: src/agent_ecology3/world/action_executor.py:751
  - name: transfer_resource
    action_type: transfer_resource
    actor: Agent
    scope: resident
    inputs: [recipient_id, resource, amount]
    rule: Move llm_budget (the only transferable resource) to another principal. Reachable but meaningless in resident runs (Codex never spends llm_budget).
    changes: [Ledger.resources]
    emits: [resource_transfer, action]
    source: src/agent_ecology3/world/action_executor.py:779
  - name: query_kernel
    action_type: query_kernel
    actor: Agent
    scope: resident
    inputs: [query_type, params]
    rule: Run a read-only query (artifacts, artifact, principals, balances, mint, events, libraries, dependencies, ...). Free; counts as an action.
    changes: []
    emits: [kernel_query, action]
    source: src/agent_ecology3/world/action_executor.py:690
  - name: delete_artifact
    action_type: delete_artifact
    actor: Agent
    scope: resident
    inputs: [artifact_id]
    rule: Soft-delete an artifact the contract lets the caller delete. A deleted passing solution is no longer linked for later tasks.
    changes: [Artifact.deleted]
    emits: [artifact_deleted, action]
    source: src/agent_ecology3/world/action_executor.py:664
  - name: subscribe_artifact
    action_type: subscribe_artifact
    actor: Agent
    scope: resident
    inputs: [artifact_id]
    rule: Legacy loop subscription bookkeeping; no effect on resident observations.
    changes: []
    emits: [action]
    source: src/agent_ecology3/world/action_executor.py:707
  - name: unsubscribe_artifact
    action_type: unsubscribe_artifact
    actor: Agent
    scope: resident
    inputs: [artifact_id]
    rule: Inverse of subscribe_artifact.
    changes: []
    emits: [action]
    source: src/agent_ecology3/world/action_executor.py:710
  - name: noop
    action_type: noop
    actor: Agent
    scope: resident
    inputs: []
    rule: Do nothing; still counts as an action.
    changes: []
    emits: [action]
    source: src/agent_ecology3/world/action_executor.py:111
  - name: send_message
    action_type: send_message
    actor: Agent
    scope: resident
    inputs: [recipient_id, content]
    rule: Free note (1-1000 chars) to another existing agent, appended to its inbox and shown at the start of its next turn. Counts as an action; does not advance event_number.
    changes: [Agent.inbox (recipient)]
    emits: [agent_message]
    source: src/agent_ecology3/simulation/resident.py:217
  - name: propose_change
    action_type: propose_change
    actor: Agent
    scope: resident
    inputs: [content (optional note)]
    rule: Shared-project runs only. Log change_submitted with the branch state, then integrate; on success judge, pay bounties and pay function royalties, and answer with the standings that moved and what was paid. Counts as an action; does not advance event_number. A git or aes failure sets the kernel's fatal error and the run stops as invalid after the turn.
    changes: [SharedProject, Ledger.scrip]
    emits: [change_submitted]
    source: src/agent_ecology3/simulation/resident.py:252
  - name: integrate
    actor: Kernel
    scope: resident
    inputs: [AgentBranch]
    rule: Commit the agent's edits to tracked library files (git add -u on the library roots; authored as the agent), merge main into its branch, and fast-forward main to it. Rejected when conflict markers remain, the merge conflicts (the conflicted merge stays in the agent's folder to resolve), nothing is new, or the change touches anything but existing library files. Untracked files and edits elsewhere stay in the folder unproposed.
    changes: [SharedProject (main), AgentBranch]
    emits: [change_integrated, change_rejected]
    source: src/agent_ecology3/simulation/pilot.py:259
  - name: judge
    actor: Kernel
    scope: resident
    inputs: [integrated commit]
    rule: Run aes evidence record for every verification subject at the new main (command from pilot.json behind a 120 s timeout, --depends-on tests/conftest.py), commit the observations as the kernel, then aes reconcile --json. Standings before are the previous reconcile's.
    changes: [Observation, SharedProject.last_reconcile]
    emits: [aes_judged]
    source: src/agent_ecology3/simulation/pilot.py:315
  - name: pay_bounty
    actor: Kernel
    scope: resident
    inputs: [standings after judge, SharedProject.held]
    rule: A criterion SUPPORTED now and not held pays bounty_scrip (minted) split equally (remainder one each, most lines first) among the agents with surviving lines in its observation's library dependency files; it becomes held. A held criterion that is not SUPPORTED now (REFUTED, or INSUFFICIENT because its evidence went STALE) is released and pays nothing; SUPPORTED again later pays again with regained true. No agent-authored line means no payment and the criterion stays unheld.
    changes: [Ledger.scrip, SharedProject.held]
    emits: [bounty_paid]
    source: src/agent_ecology3/simulation/pilot.py:383
  - name: pay_function_royalty
    actor: Kernel
    scope: resident
    inputs: [integrated diff]
    rule: For each module-level library function the change's added lines call or import, resolved through the file's imports (f() with f imported from a library module or defined at module level in the same file; mod.f() with mod an imported library module; from <library module> import f), whose body (docstring excluded) is mostly authored by another agent per git blame, credit that author royalty_scrip (3, minted) once per (change, author, function). Method calls on objects are not resolved, so a builtin or dict method never pays by name alone.
    changes: [Ledger.scrip]
    emits: [royalty_paid]
    source: src/agent_ecology3/simulation/pilot.py:432
  # --- kernel paths resident agents cannot reach ------------------------
  - name: edit_artifact
    action_type: edit_artifact
    actor: Agent
    scope: resident_unreachable
    inputs: [artifact_id, old_string, new_string]
    rule: Replace one string in an artifact. The ae3_action tool has no old_string/new_string fields; all 8 attempts in run5 were refused as invalid_action.
    changes: [Artifact.content]
    emits: [artifact_edited, action]
    source: src/agent_ecology3/world/action_executor.py:298
  - name: invoke_artifact
    action_type: invoke_artifact
    actor: Agent
    scope: resident_unreachable
    inputs: [artifact_id, method, args]
    rule: Run an executable artifact's method in the sandbox. The tool has no method field.
    changes: [depends on artifact]
    emits: [invoke_success, invoke_failure, loop_decision, loop_memory_update_error, action]
    source: src/agent_ecology3/world/action_executor.py:459
  - name: update_metadata
    action_type: update_metadata
    actor: Agent
    scope: resident_unreachable
    inputs: [artifact_id, key, value]
    rule: Set or clear one metadata key on a writable artifact. The tool has no key field.
    changes: [Artifact.metadata]
    emits: [metadata_updated, action]
    source: src/agent_ecology3/world/action_executor.py:868
  - name: mint
    action_type: mint
    actor: Artifact with can_mint capability
    scope: resident_unreachable
    inputs: [recipient_id, amount, reason]
    rule: Create scrip for a principal; only callers holding the can_mint capability. The tool has no reason field.
    changes: [Ledger.scrip]
    emits: [mint, action]
    source: src/agent_ecology3/world/action_executor.py:823
  # --- legacy runs (autonomous loops, auction mint, LLM syscalls) --------
  - name: auction_mint
    actor: Checker
    scope: legacy
    inputs: [submissions, bids]
    rule: Periodic second-price auction scored by an LLM grader (mint mode auction); not used in task_bounty runs.
    changes: [Ledger.scrip]
    emits: [mint_submission, mint_submission_cancelled, mint_scoring_failed, mint_auction]
    source: src/agent_ecology3/world/mint.py:449
  - name: llm_syscall
    actor: Kernel
    scope: legacy
    inputs: [loop artifact LLM call]
    rule: Reserve, settle or fail an in-world LLM call against the payer's llm_budget.
    changes: [Ledger.resources.llm_budget]
    emits: [llm_syscall, llm_syscall_error, llm_syscall_token_overage, llm_syscall_replayed]
    source: src/agent_ecology3/world/world.py:2689
  - name: loop_runner
    actor: Kernel
    scope: legacy
    inputs: [duration, loops]
    rule: Run autonomous loop artifacts on a timer with error backoff.
    changes: []
