# How each view treats each resident-scope event. Values:
#   shown | partial (shown without key fields) | hidden (deliberate, reason
#   given) | missing (relevant, not shown, no recorded reason).
# Human-readable table and evidence: docs/model/VIEW_COVERAGE.md.
