  living:
    source: src/agent_ecology3/viz/world_substrate_view.py:67 (build_projection), :310 (build_profile)
view_coverage:
  world_initialized:        {feed: hidden, matrix: hidden, living: partial}
  resident_action:          {feed: shown, matrix: hidden, living: missing}
  resident_turn:            {feed: shown, matrix: hidden, living: shown}
  resident_session_changed: {feed: missing, matrix: hidden, living: hidden}
  agent_message:            {feed: shown, matrix: shown, living: shown}
  action:                   {feed: hidden, matrix: hidden, living: hidden}
  artifact_read:            {feed: shown, matrix: shown, living: partial}
  artifact_written:         {feed: partial, matrix: hidden, living: partial}
  task_bounty_scored:       {feed: shown, matrix: partial, living: shown}
  royalty_paid:             {feed: shown, matrix: shown, living: shown}
  transfer:                 {feed: shown, matrix: shown, living: shown}
  resource_transfer:        {feed: partial, matrix: hidden, living: hidden}
  kernel_query:             {feed: partial, matrix: hidden, living: missing}
  artifact_deleted:         {feed: partial, matrix: hidden, living: missing}
  change_submitted:         {feed: shown, matrix: hidden, living: hidden}
  change_integrated:        {feed: shown, matrix: hidden, living: shown}
  change_rejected:          {feed: shown, matrix: hidden, living: shown}
  aes_judged:               {feed: shown, matrix: hidden, living: shown}
  bounty_paid:              {feed: shown, matrix: shown, living: shown}
